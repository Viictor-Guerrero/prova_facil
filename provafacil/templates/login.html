<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Prova Fácil</title>
  <style>
    :root {
      --bg: #f8fafc;
      --pn: #ffffff;
      --ink: #0f172a;
      --mut: #64748b;
      --ln: #e2e8f0;
      --ac: #0284c7;
      --acs: #e0f2fe;
      --er: #dc2626;
      --er-bg: #fee2e2;
      --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      background: var(--pn);
      border: 1px solid var(--ln);
      border-radius: 14px;
      padding: 36px 32px;
      width: 100%;
      max-width: 400px;
      box-shadow: var(--card-shadow);
      text-align: center;
    }
    .header-logo {
      height: 52px;
      max-width: 200px;
      object-fit: contain;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    p.sub {
      color: var(--mut);
      font-size: 13.5px;
      margin-bottom: 24px;
    }
    .form-group {
      text-align: left;
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--mut);
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--ln);
      border-radius: 8px;
      font-size: 14px;
      background: var(--bg);
      color: var(--ink);
    }
    input:focus {
      outline: none;
      border-color: var(--ac);
      box-shadow: 0 0 0 3px var(--acs);
      background: #fff;
    }
    button.btn-submit {
      width: 100%;
      padding: 11px;
      background: var(--ac);
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    button.btn-submit:hover {
      background: #0369a1;
    }
    .err-box {
      margin-bottom: 16px;
      padding: 10px;
      border-radius: 8px;
      background: var(--er-bg);
      color: var(--er);
      font-size: 13px;
      border-left: 4px solid var(--er);
      text-align: left;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" class="header-logo" onerror="this.style.display='none'">
    <h1>Prova Fácil</h1>
    <p class="sub">Autenticação de Usuário</p>

    {% if erro %}
    <div class="err-box">{{ erro }}</div>
    {% endif %}

    <form method="POST" action="/login">
      <div class="form-group">
        <label for="username">Usuário</label>
        <input type="text" id="username" name="username" placeholder="Digite seu usuário..." required autofocus autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" placeholder="Digite sua senha..." required autocomplete="current-password">
      </div>

      <button type="submit" class="btn-submit">Entrar no Sistema</button>
    </form>
  </div>

</body>
</html>
